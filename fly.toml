# fly.toml — backend API only (Postgres/Redis via Fly secrets or external managed services)
# Usage:
#   fly secrets set DATABASE_URL=... REDIS_URL=... JWT_ACCESS_SECRET=... JWT_REFRESH_SECRET=... ALLOWED_ORIGINS=https://your-app.fly.dev
#   fly deploy --config fly.toml

app = "goerp-api"
primary_region = "gru"

[build]
  dockerfile = "backend/Dockerfile.fly"

[env]
  APP_ENV = "production"
  HTTP_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[deploy]
  release_command = "/goerp-migrate"
  release_command_timeout = "5m"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
