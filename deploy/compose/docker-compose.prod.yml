services:
  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.migrate
    env_file:
      - ${GOERP_ENV_FILE:?Set GOERP_ENV_FILE to a real production env file}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../../backend
    env_file:
      - ${GOERP_ENV_FILE:?Set GOERP_ENV_FILE to a real production env file}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: ../../frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GOERP_DOMAIN: ${GOERP_DOMAIN:?Set GOERP_DOMAIN to the production domain}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${GOERP_ENV_FILE:?Set GOERP_ENV_FILE to a real production env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-goerp} -d $${POSTGRES_DB:-goerp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
