name: Deploy VPS

# Profile A (DEPLOYMENT.md): full-stack deploy to a VPS running
# deploy/compose/docker-compose.prod.yml + Caddy. Manual trigger only —
# production rollouts stay operator-approved (harness invariant: no auto-push).
#
# Required secrets:
#   VPS_SSH_KEY    private key allowed to SSH the deploy user
#   VPS_HOST       hostname or IP of the VPS
#   VPS_USER       deploy user (needs docker group + write access to VPS_DEPLOY_DIR)
# Optional secrets (defaults shown):
#   VPS_PORT          22
#   VPS_DEPLOY_DIR    /opt/goerp
# The VPS itself holds GOERP_ENV_FILE (/etc/goerp/goerp.env) and GOERP_DOMAIN;
# they never travel through GitHub.

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_DIR || '/opt/goerp' }}"
            export GOERP_ENV_FILE=/etc/goerp/goerp.env
            export GOERP_DOMAIN="${{ secrets.VPS_DOMAIN }}"

            git pull --ff-only origin main

            echo "[deploy] building images"
            docker compose -f deploy/compose/docker-compose.prod.yml build

            echo "[deploy] running migration job"
            docker compose -f deploy/compose/docker-compose.prod.yml run --rm migrate

            echo "[deploy] rolling services"
            docker compose -f deploy/compose/docker-compose.prod.yml up -d --wait

            echo "[deploy] health check"
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                echo "[deploy] healthy"; exit 0
              fi
              sleep 5
            done
            echo "[deploy] ERROR: backend unhealthy after rollout" >&2
            exit 1
